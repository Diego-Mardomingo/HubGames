name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Solo en master: un PR en rojo ya se ve en el propio PR.
      - name: Avisar del resultado
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: ./.github/actions/report-workflow
        with:
          status: ${{ job.status }}
