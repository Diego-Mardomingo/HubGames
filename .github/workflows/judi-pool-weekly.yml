name: JUDI Pool Weekly

on:
  schedule:
    # Domingos a las 18:00 UTC (20:00 CEST / 19:00 CET)
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  build-judi-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Comprobar secretos de Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && missing="${missing}NEXT_PUBLIC_SUPABASE_URL "
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="${missing}SUPABASE_SERVICE_ROLE_KEY "
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos de Actions (valores vacíos): $missing"
            echo "Añádelos en el repo: Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi

      - name: Install dependencies
        run: |
          echo "::group::npm ci"
          npm ci
          echo "::endgroup::"

      - name: Build weekly pool from Steam
        id: build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: |
          echo "::group::Construcción pool semanal Steam"
          echo "Inicio: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          npx tsx scripts/build-judi-pool.ts
          echo "Fin: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "::endgroup::"

      - name: Resumen
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "::notice::Pool semanal construida correctamente."
          else
            echo "::error::Falló la construcción del pool semanal. Revisa los logs del step anterior."
          fi
