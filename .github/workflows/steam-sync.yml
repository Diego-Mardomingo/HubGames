name: Steam Sync

# Sincronización diaria con Steam (#14): biblioteca, foto de horas (#15) y logros (#13) de todos los usuarios vinculados.
# También sirve para la primera sincronización completa, que no cabe en una función de Vercel Hobby.
on:
  schedule:
    # 03:00 en Madrid en verano (UTC+2) y 02:00 en invierno (UTC+1). La foto de horas se apunta al día anterior.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      user_id:
        description: 'UUID de un usuario concreto (vacío = todos los vinculados)'
        required: false
        default: ''

jobs:
  steam-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Comprobar secretos
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: |
          missing=""
          [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && missing="${missing}NEXT_PUBLIC_SUPABASE_URL "
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="${missing}SUPABASE_SERVICE_ROLE_KEY "
          [ -z "$STEAM_WEB_API_KEY" ] && missing="${missing}STEAM_WEB_API_KEY "
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos de Actions (valores vacíos): $missing"
            echo "Añádelos en el repo: Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Sincronizar con Steam
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          USER_ID: ${{ inputs.user_id }}
        run: |
          if [ -n "$USER_ID" ]; then
            npx tsx scripts/steam-sync.ts --user "$USER_ID"
          else
            npx tsx scripts/steam-sync.ts
          fi
