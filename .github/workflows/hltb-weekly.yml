name: HLTB Weekly

# Duraciones de HowLongToBeat (#23) para los juegos de bibliotecas, tracker y wishlist.
# Solo consulta los que no tienen dato o lo tienen de hace más de 90 días, con pausas entre peticiones.
on:
  schedule:
    # Lunes a las 04:00 UTC, lejos del sync diario de Steam (01:00 UTC).
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Máximo de juegos a consultar'
        required: false
        default: '300'

permissions:
  contents: read
  issues: write

concurrency:
  group: hltb-weekly
  cancel-in-progress: false

jobs:
  hltb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scripts/hltb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/hltb/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests del emparejamiento
        run: python -m unittest -v test_matching

      - name: Consultar HowLongToBeat
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMIT: ${{ inputs.limit || '300' }}
          PYTHONUNBUFFERED: '1'
        run: python hltb_sync.py --limit "$LIMIT"

      - name: Avisar del resultado
        if: ${{ !cancelled() }}
        uses: ./.github/actions/report-workflow
        with:
          status: ${{ job.status }}
